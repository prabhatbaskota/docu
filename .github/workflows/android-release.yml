name: Android signed release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: false
      - name: Configure Android signing
        shell: pwsh
        env:
          DOCU_APPLICATION_ID: ${{ secrets.DOCU_APPLICATION_ID }}
          DOCU_KEYSTORE_BASE64: ${{ secrets.DOCU_KEYSTORE_BASE64 }}
        run: |
          foreach ($name in @('DOCU_APPLICATION_ID','DOCU_KEYSTORE_BASE64')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing GitHub secret $name" }
          }
          if ($env:DOCU_APPLICATION_ID -eq 'com.yourname.docapp') { throw 'Choose a permanent application ID.' }
          [IO.File]::WriteAllBytes('android/upload-keystore.jks', [Convert]::FromBase64String($env:DOCU_KEYSTORE_BASE64))
      - name: Analyze, test, and build
        shell: pwsh
        env:
          DOCU_APPLICATION_ID: ${{ secrets.DOCU_APPLICATION_ID }}
          DOCU_KEYSTORE_PATH: ../upload-keystore.jks
          DOCU_STORE_PASSWORD: ${{ secrets.DOCU_STORE_PASSWORD }}
          DOCU_KEY_ALIAS: ${{ secrets.DOCU_KEY_ALIAS }}
          DOCU_KEY_PASSWORD: ${{ secrets.DOCU_KEY_PASSWORD }}
        run: |
          foreach ($name in @('DOCU_APPLICATION_ID','DOCU_STORE_PASSWORD','DOCU_KEY_ALIAS','DOCU_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing GitHub secret $name" }
          }
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed' }
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Analysis failed' }
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          flutter build apk --release --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'APK build failed' }
          flutter build appbundle --release --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'App bundle build failed' }
      - name: Package artifacts and checksums
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches.Groups[1].Value
          if (-not $version) { throw 'Missing app version' }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item build/app/outputs/flutter-apk/app-release.apk "release/DOCU-Android-$version.apk"
          Copy-Item build/app/outputs/bundle/release/app-release.aab "release/DOCU-Android-$version.aab"
          Get-ChildItem release -File | ForEach-Object {
            "$(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" |
              Add-Content release/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docu-android-signed-release
          path: mobile/release/*
          if-no-files-found: error
          retention-days: 30
